{% extends 'base.html' %}
{% block title %}Verify OTP — WealthNest{% endblock %}
{% block navbar %}{% endblock %}
{% block layout %}
<section style="min-height:100vh; display:grid; place-items:center; padding:1rem; background:linear-gradient(135deg, var(--indigo), var(--indigo-2));">
  <div style="max-width:420px; width:100%;">
    <div class="text-center mb-3 broken-piggy" style="font-size:5rem">🐷</div>
    <div class="wn-card">
      <h3 class="text-center">Enter OTP</h3>
      <p class="text-center text-muted-wn">Check your email for the 6-digit code.</p>
      {% if messages %}{% for m in messages %}<div data-toast="{{m|escapejs}}" data-toast-type="{{m.tags}}"></div>{% endfor %}{% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="wn-form-group"><label class="wn-form-label">6-Digit OTP</label><input type="text" name="otp" maxlength="6" minlength="6" required style="letter-spacing:8px; font-family:Poppins; font-size:1.4rem; text-align:center;"></div>
        <button type="submit" class="btn-wn btn-gold w-100">Verify</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
