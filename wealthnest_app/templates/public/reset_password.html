{% extends 'base.html' %}
{% block title %}Reset Password — WealthNest{% endblock %}
{% block navbar %}{% endblock %}
{% block layout %}
<section style="min-height:100vh; display:grid; place-items:center; padding:1rem; background:linear-gradient(135deg, var(--indigo), var(--indigo-2));">
  <div style="max-width:420px; width:100%;">
    <div class="text-center mb-3 broken-piggy" style="font-size:5rem">🐷</div>
    <div class="wn-card">
      <h3 class="text-center">Set New Password</h3>
      {% if messages %}{% for m in messages %}<div data-toast="{{m|escapejs}}" data-toast-type="{{m.tags}}"></div>{% endfor %}{% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="wn-form-group"><label class="wn-form-label">New Password</label><input type="password" name="password" minlength="6" required></div>
        <div class="wn-form-group"><label class="wn-form-label">Confirm Password</label><input type="password" name="confirm_password" minlength="6" required></div>
        <button type="submit" class="btn-wn btn-gold w-100">Reset Password</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
