{% extends 'base.html' %}
{% block title %}New Complaint — WealthNest{% endblock %}
{% block sidebar %}{% include 'partials/sidebar_dependent.html' %}{% endblock %}
{% block content %}
<a href="{% url 'dependent_complaints' %}" class="text-muted-wn">← Back</a>
<h2 class="mt-2">📮 Tell Admin</h2>
<div class="wn-card" style="max-width:680px">
  <form method="post">
    {% csrf_token %}
    <div class="wn-form-group"><label class="wn-form-label">Subject *</label><input type="text" name="subject" required></div>
    <div class="wn-form-group"><label class="wn-form-label">Priority</label>
      <select name="priority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select>
    </div>
    <div class="wn-form-group"><label class="wn-form-label">Describe the issue *</label><textarea name="description" rows="5" required></textarea></div>
    <button class="btn-wn btn-gold">Submit</button>
  </form>
</div>
{% endblock %}
